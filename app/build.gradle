plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'

}

android {
    namespace "com.example.comprasmu"
    dataBinding {
        enabled = true
    }
    testOptions {
        unitTests.includeAndroidResources = true
    }

    compileSdk = 33

    defaultConfig {
        applicationId "com.example.comprasmu"
        minSdkVersion 23
        //noinspection ExpiredTargetSdkVersion
        targetSdkVersion 29
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"


    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources  true
            debuggable true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        viewBinding true
    }
}

apply plugin: 'com.jakewharton.butterknife'
dependencies {
    // Importa el BOM de Lifecycle (la versión 2.5.1 es segura para SDK 33)
    def lifecycle_version = "2.5.1"

    implementation "androidx.lifecycle:lifecycle-viewmodel:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel"

    // --- UI BASE ---
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // implementation 'com.google.android.material:material:1.3.0'
    implementation 'com.google.android.material:material:1.9.0'
    //implementation 'androidx.constraintlayout:constraintlayout:2.1.3'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    //implementation "androidx.recyclerview:recyclerview:1.1.0"
    implementation "androidx.recyclerview:recyclerview:1.3.0"
    //implementation "androidx.cardview:cardview:1.0.0"
    implementation "androidx.cardview:cardview:1.0.0"
    //implementation 'androidx.coordinatorlayout:coordinatorlayout:1.1.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'

   // implementation 'androidx.navigation:navigation-fragment:2.2.2'
   // implementation 'androidx.navigation:navigation-ui:2.2.2'
    implementation 'androidx.navigation:navigation-fragment:2.5.3'
    implementation 'androidx.navigation:navigation-ui:2.5.3'

   // implementation 'androidx.room:room-runtime:2.3.0'
    implementation 'androidx.room:room-runtime:2.5.2'
    annotationProcessor 'androidx.room:room-compiler:2.5.2'

    def work_version = "2.8.1"
    // (Java only)
    implementation "androidx.work:work-runtime:$work_version"

    //implementation 'com.squareup.retrofit2:retrofit:2.1.0'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    //implementation 'com.google.code.gson:gson:2.3.1'
    implementation 'com.google.code.gson:gson:2.10.1'
    // --- GOOGLE SERVICES ---
    //implementation("com.google.android.gms:play-services-location:21.3.0")
    //implementation 'com.google.android.gms:play-services-maps:18.0.2'
    implementation("com.google.android.gms:play-services-location:21.3.0")
    implementation 'com.google.android.gms:play-services-maps:18.1.0'
    //implementation 'com.google.maps.android:android-maps-utils:0.4+'
    implementation 'com.google.maps.android:android-maps-utils:2.3.0'

    // --- FIREBASE (Versiones estables para SDK 33) ---
    //implementation 'com.google.firebase:firebase-crashlytics:17.4.1'
    //implementation 'com.google.firebase:firebase-analytics:18.0.3'
    //implementation 'com.google.firebase:firebase-messaging:17.3.4'
    implementation 'com.google.firebase:firebase-crashlytics:18.3.7'
    implementation 'com.google.firebase:firebase-analytics:21.2.2'
    implementation 'com.google.firebase:firebase-messaging:23.1.2'
    // --- CAMERAX & MEDIA3 ( versiones correctas para SDK 33) ---
    def camerax_version = "1.2.3"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation"androidx.camera:camera-view:${camerax_version}"
    implementation "androidx.camera:camera-extensions:${camerax_version}"
    implementation "androidx.media3:media3-exoplayer:1.1.1"
    implementation "androidx.media3:media3-exoplayer-dash:1.1.1"
    implementation "androidx.media3:media3-ui:1.1.1"
    // --- TESTING (Limpiado de librerías viejas) ---
    //testImplementation 'junit:junit:4.12'
    testImplementation 'junit:junit:4.13.2'
    //androidTestImplementation 'androidx.test.ext:junit:1.1.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    //androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    testImplementation "androidx.test:core:1.5.0"
    // --- OTRAS LIBRERÍAS ---
    implementation 'com.github.santalu:maskara:1.0.0'
    implementation 'net.gotev:uploadservice:4.7.0'
    //implementation 'com.github.bumptech.glide:glide:3.7.0'
    implementation 'com.github.bumptech.glide:glide:4.15.1'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.15.1'
    // Because RxAndroid releases are few and far between, it is recommended you also
    // explicitly depend on RxJava's latest version for bug fixes and new features.
    // (see https://github.com/ReactiveX/RxJava/releases for latest 3.x.x version)
    //implementation 'io.reactivex.rxjava3:rxjava:3.0.0'
    implementation 'io.reactivex.rxjava3:rxjava:3.1.6'
    //implementation('com.journeyapps:zxing-android-embedded:4.1.0')
    //implementation 'com.google.zxing:core:3.3.0'
    implementation('com.journeyapps:zxing-android-embedded:4.3.0')
    implementation 'com.google.zxing:core:3.5.1'
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'
    // required if you want to use Mockito for unit tests
    testImplementation 'org.mockito:mockito-core:2.24.5'
    // required if you want to use Mockito for Android tests
    androidTestImplementation 'org.mockito:mockito-android:2.24.5'
    //
    androidTestImplementation 'com.android.support.test:runner:1.0.1'
    androidTestImplementation 'androidx.arch.core:core-testing:2.2.0'

    implementation("androidx.tracing:tracing:1.1.0")

    //clases que ya no se usan
    //implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    //implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.3.1'
    //implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.3.1'
    /*
    implementation 'androidx.annotation:annotation:1.1.0'
    def fragment_version = "1.3.6"*/

    //implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    //


    //implementation "androidx.fragment:fragment:$fragment_version"

   /* implementation'com.github.devdhar04:MaterialSpinner:v0.1.2'


    implementation 'com.basgeekball:awesome-validation:2.0'
    implementation 'com.fasterxml.jackson.core:jackson-core:2.1.4'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.1.4'
    //implementation 'com.jakewharton:butterknife:10.1.0'
  //  annotationProcessor 'com.jakewharton:butterknife-compiler:10.1.0'

    //def work_version = "2.4.0"
    // Kotlin + coroutines
    implementation "androidx.work:work-runtime-ktx:$work_version"
    implementation 'com.google.guava:guava:27.0.1-android'

    */

}
configurations.all {
    resolutionStrategy {
        force("androidx.tracing:tracing:1.2.0")
